plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Optional integrations (Trinkets, Cloth Config, Mod Menu) are pulled from Modrinth's Maven.
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
	maven { name = "Ladysnake"; url = "https://maven.ladysnake.org/releases" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dinosaurs" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

loom {
	mods {
		"dinosaurs-test" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		// Server game tests: ./gradlew runGametest
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		// Client smoke test with screenshots: xvfb-run ./gradlew runClientSmoke
		clientSmoke {
			client()
			name = "Client Smoke"
			vmArg "-Ddinosaurs.smoke=true"
			vmArg "-Ddinosaurs.smokeShots=" + (project.findProperty("smokeShots") ?: "/workspace/dino-backport/" + project.minecraft_version)
			if (project.findProperty("megalodonOnly")) {
				// -PmegalodonOnly=true: only the 1.7.1 Megalodon close-up culling check
				vmArg "-Ddinosaurs.megalodonOnly=true"
			}
			if (project.findProperty("trimOnly")) {
				// -PtrimOnly=true: only the 1.7.2 armor trim check and screenshots
				vmArg "-Ddinosaurs.trimOnly=true"
			}
			runDir "build/clientsmoke"
			source sourceSets.gametest
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// All three are OPTIONAL at runtime: the mod checks FabricLoader.isModLoaded before touching them.
	modCompileOnly "maven.modrinth:trinkets:${project.trinkets_version}"
	modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	modCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	if (project.findProperty("withCloth") == "true") {
		modLocalRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
		modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	}
	if (project.findProperty("withTrinkets") == "true") {
		modLocalRuntime "maven.modrinth:trinkets:${project.trinkets_version}"
		modLocalRuntime "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
		modLocalRuntime "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	}
	if (project.findProperty("xaeroJar")) {
		modLocalRuntime files(project.property("xaeroJar").split(","))
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// ./gradlew runClientSmoke -PxaeroJar=/path/to/xaerominimap-fabric-<mc>-<ver>.jar
//   -> only the Xaero's Minimap radar part runs (icons + names always on), screenshot xaero_radar.png
if (project.findProperty("xaeroJar")) {
	def xaeroCfg = file("build/clientsmoke/config/xaero/minimap/profiles/default.cfg")
	def xaeroCategories = file("src/gametest/xaero/default_radar_categories_client.json")
	def xaeroCategoriesTarget = file("build/clientsmoke/config/xaero/minimap/default_radar_categories_client.json")
	tasks.matching { it.name == "runClientSmoke" }.configureEach {
		systemProperty "dinosaurs.xaeroOnly", "true"
		doFirst {
			xaeroCfg.parentFile.mkdirs()
			def want = [minimap_size: "200", minimap_zoom: "6", minimap_north_locked: "true", minimap_ui_scale: "2"]
			def lines = xaeroCfg.exists() ? xaeroCfg.readLines() : []
			want.each { k, v ->
				int i = lines.findIndexOf { it.startsWith(k + " = ") }
				if (i >= 0) lines[i] = k + " = " + v else lines << (k + " = " + v)
			}
			xaeroCfg.text = lines.join("\n") + "\n"
			xaeroCategoriesTarget.parentFile.mkdirs()
			xaeroCategoriesTarget.text = xaeroCategories.text
		}
	}
}
