plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Optional integrations (Trinkets Updated, Cloth Config, Mod Menu) are pulled from Modrinth's Maven.
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dinosaurs" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Client game test used to render every mob and take screenshots (run with xvfb-run ./gradlew runClientGameTest).
	configureTests {
		createSourceSet = true
		modId = "dinosaurs-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// All three are OPTIONAL at runtime: the mod checks FabricLoader.isModLoaded before touching them.
	compileOnly "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	compileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	if (project.findProperty("xaeroJar")) {
		// ./gradlew runClientGameTest -PxaeroJar=/path/to/xaerominimap-fabric-<mc>-<ver>.jar
		//   -> only XaeroRadarScreenshotTest runs: minimap radar screenshots with the dinosaur head icons
		localRuntime files(project.property("xaeroJar"))
	}
	if (project.findProperty("withCloth") == "true") {
		// ./gradlew runClientGameTest -PwithCloth=true  -> Cloth Config + Mod Menu at runtime (config screen screenshots)
		localRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
		localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	}
	if (project.findProperty("withTrinkets") == "true") {
		// ./gradlew runServer -PwithTrinkets=true  -> test the Trinkets integration in the dev server
		localRuntime "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}

// -PclawOnly=true: run only the Dinosaur Claw screenshot test. -PclawShots=dir: where its screenshots go (default /workspace/dino-claw).
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	if (project.findProperty("clawOnly")) {
		systemProperty "dinosaurs.clawOnly", "true"
	}
	if (project.findProperty("clawShots")) {
		systemProperty "dinosaurs.clawShots", project.property("clawShots")
	}
	// -PcollarOnly=true: run only the Dino Collar / Megalodon / config screenshot test (1.7.0). -PcollarShots=dir (default /workspace/dino-collar).
	if (project.findProperty("collarOnly")) {
		systemProperty "dinosaurs.collarOnly", "true"
	}
	if (project.findProperty("collarShots")) {
		systemProperty "dinosaurs.collarShots", project.property("collarShots")
	}
}

if (project.findProperty("xaeroJar")) {
	def xaeroCfg = file("build/run/clientGameTest/config/xaero/minimap/profiles/default.cfg")
	// -PxaeroRadar=always: icons and names always on (no Tab needed). Default: Xaero's defaults (icons while Tab is held).
	def xaeroAlways = project.findProperty("xaeroRadar") == "always"
	def xaeroCategories = file("src/gametest/xaero/default_radar_categories_client.json")
	def xaeroCategoriesTarget = file("build/run/clientGameTest/config/xaero/minimap/default_radar_categories_client.json")
	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		systemProperty "dinosaurs.xaeroOnly", "true"
		systemProperty "dinosaurs.xaeroRadar", xaeroAlways ? "always" : "tab"
		systemProperty "dinosaurs.xaeroShots", project.findProperty("xaeroShots") ?: "/workspace/dino-xaero"
		// A bigger, zoomed-in, north-locked minimap so the radar icons are easy to see. Xaero keeps any other options.
		doFirst {
			def cfg = xaeroCfg
			cfg.parentFile.mkdirs()
			def want = [minimap_size: "200", minimap_zoom: "6", minimap_north_locked: "true", minimap_ui_scale: "2"]
			def lines = cfg.exists() ? cfg.readLines() : []
			want.each { k, v ->
				int i = lines.findIndexOf { it.startsWith(k + " = ") }
				if (i >= 0) lines[i] = k + " = " + v else lines << (k + " = " + v)
			}
			cfg.text = lines.join("\n") + "\n"
			if (xaeroAlways) {
				xaeroCategoriesTarget.text = xaeroCategories.text
			}
		}
	}
}
