plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Optional integrations (Trinkets Updated, Cloth Config, Mod Menu) are pulled from Modrinth's Maven.
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dinosaurs" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Client game test used to render every mob and take screenshots (run with xvfb-run ./gradlew runClientGameTest).
	configureTests {
		createSourceSet = true
		modId = "dinosaurs-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// All three are OPTIONAL at runtime: the mod checks FabricLoader.isModLoaded before touching them.
	compileOnly "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	compileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	if (project.findProperty("withTrinkets") == "true") {
		// ./gradlew runServer -PwithTrinkets=true  -> test the Trinkets integration in the dev server
		localRuntime "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
